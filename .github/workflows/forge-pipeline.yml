name: The Automated Forge
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  forge_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::410232016779:role/DevSecOps-Pipeline-Role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Install tfsec
        run: |
          curl -s -L https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o tfsec
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/tfsec

      - name: Run tfsec (readable output)
        run: tfsec .

      - name: Terraform Apply
        run: terraform apply -auto-approve